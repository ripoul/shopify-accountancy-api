name: Deploy App Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Collect static files
        run: uv run python manage.py collectstatic --noinput
        env:
          SECRET_KEY: collectstatic-only
          DEBUG: "false"
          ALLOWED_HOSTS: localhost
          SHOPIFY_API_KEY: placeholder
          SHOPIFY_API_SECRET: placeholder
          SHOPIFY_SCOPES: placeholder
          SHOPIFY_REDIRECT_URI: placeholder

      - name: Build App Engine deploy directory
        run: |
          rm -rf gae-deploy
          mkdir -p gae-deploy
          cp -R config core manage.py staticfiles gae-deploy/
          cp app.yaml gae-deploy/app.yaml
          uv export --locked --no-dev --no-hashes --output-file gae-deploy/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Run migrations
        run: uv run python manage.py migrate --noinput
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "false"
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          CSRF_TRUSTED_ORIGINS: ${{ vars.CSRF_TRUSTED_ORIGINS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
          SHOPIFY_SCOPES: ${{ vars.SHOPIFY_SCOPES }}
          SHOPIFY_REDIRECT_URI: ${{ vars.SHOPIFY_REDIRECT_URI }}

      - name: Escape App Engine env vars
        id: app-engine-env
        run: |
          echo "allowed_hosts=${ALLOWED_HOSTS//,/\\,}" >> "$GITHUB_OUTPUT"
          echo "cors_allowed_origins=${CORS_ALLOWED_ORIGINS//,/\\,}" >> "$GITHUB_OUTPUT"
          echo "csrf_trusted_origins=${CSRF_TRUSTED_ORIGINS//,/\\,}" >> "$GITHUB_OUTPUT"
          echo "shopify_scopes=${SHOPIFY_SCOPES//,/\\,}" >> "$GITHUB_OUTPUT"
        env:
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          CSRF_TRUSTED_ORIGINS: ${{ vars.CSRF_TRUSTED_ORIGINS }}
          SHOPIFY_SCOPES: ${{ vars.SHOPIFY_SCOPES }}

      - name: Deploy to App Engine
        id: deploy
        uses: google-github-actions/deploy-appengine@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          working_directory: gae-deploy
          deliverables: app.yaml
          promote: true
          env_vars: |-
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=false
            ALLOWED_HOSTS=${{ steps.app-engine-env.outputs.allowed_hosts }}
            CORS_ALLOWED_ORIGINS=${{ steps.app-engine-env.outputs.cors_allowed_origins }}
            CSRF_TRUSTED_ORIGINS=${{ steps.app-engine-env.outputs.csrf_trusted_origins }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SHOPIFY_API_KEY=${{ secrets.SHOPIFY_API_KEY }}
            SHOPIFY_API_SECRET=${{ secrets.SHOPIFY_API_SECRET }}
            SHOPIFY_API_VERSION=${{ vars.SHOPIFY_API_VERSION }}
            SHOPIFY_SCOPES=${{ steps.app-engine-env.outputs.shopify_scopes }}
            SHOPIFY_REDIRECT_URI=${{ vars.SHOPIFY_REDIRECT_URI }}
